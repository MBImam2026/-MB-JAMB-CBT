<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MB JAMB CBT V1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>MB JAMB CBT V1</h1>
            <div id="timer">Time Left: <span id="time">10:00</span></div>
        </header>

        <main id="quiz-container">
            <div id="question-number">Question 1</div>
            <div id="question-text">Loading question...</div>

            <div id="options-container" class="options">
                <!-- Options will load dynamically -->
            </div>

            <div class="navigation-buttons">
                <button id="prev-btn">Previous</button>
                <button id="next-btn">Next</button>
                <button id="submit-btn">Submit Exam</button>
            </div>
        </main>

        <section id="result-container" class="hidden">
            <h2>Exam Completed!</h2>
            <p id="score-text"></p>
            <button id="restart-btn">Restart Exam</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
