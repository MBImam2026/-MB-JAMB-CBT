<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JAMB CBT Practice App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="cbt-container">
    <header>
      <h1>JAMB CBT Practice</h1>
      <!-- Subject Switcher Navigation -->
      <div class="subject-tabs">
        <button class="subject-btn active" onclick="switchSubject('chemistry')">Chemistry</button>
        <button class="subject-btn" onclick="switchSubject('biology')">Biology</button>
        <button class="subject-btn" onclick="switchSubject('english')">English</button>
      </div>
    </header>

    <main>
      <div id="question-box">
        <h2 id="question-text">Loading question...</h2>
        <div id="options-container" class="options-grid"></div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
